name: Bug report or camera test result
description: Tell us what happened in Apertrove or share a camera compatibility result
body:
  - type: markdown
    attributes:
      value: Thanks for helping test Apertrove. Describe what you tried in your own words; unknown camera or runtime details are fine. Do not upload Canon SDK files, private photographs, serial numbers or remote access links.
  - type: input
    id: version
    attributes:
      label: Apertrove version and Windows version
      placeholder: For example, Apertrove 0.10.3, Windows 10 x64
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Camera setup, if relevant
      description: Camera model and firmware, lens and AF/MF switch, camera dial/drive mode, runtime version if known, and whether other camera apps were closed. Leave out serial numbers.
  - type: textarea
    id: steps
    attributes:
      label: What did you try?
      description: List the steps. For shutter or focus problems, mention clicking versus holding, mouse/keyboard, Live View and any recent AI Servo change.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected result and actual result
      description: Successful compatibility reports are welcome too. Say which actions you checked.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Optional screenshot or short log
      description: Remove private paths, personal images, serial numbers, network details, QR codes and remote access keys. Keep the original log privately. Do not attach proprietary binaries, headers or dumps.

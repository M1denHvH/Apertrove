name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify native admission guards without SDK loading
        run: node --no-addons --max-old-space-size=192 --test tests/native-hardware/h1a.test.cjs tests/native-hardware/h1-guard.test.cjs tests/native-hardware/h2-guard.test.cjs tests/native-production/h2-controls.test.cjs
      - name: Run isolated T1 regression suite
        run: npm run test:t1
      - run: npm run i18n:check
      - run: npm run build
      - run: npm run preflight

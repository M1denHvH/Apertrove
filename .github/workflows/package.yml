name: Build Windows portable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run i18n:check
      - run: npm run preflight
      - run: npm run package
      - name: Archive portable application
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $name = "Apertrove-$version-Windows-x64.zip"
          Compress-Archive -LiteralPath release/win-unpacked -DestinationPath "release/$name"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "release/$name").Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Apertrove-Windows-x64
          path: |
            release/Apertrove-*-Windows-x64.zip
            release/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

<!doctype html>
<html lang="ru-RU"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f7f9">
<title data-i18n="remote.markup.apertrove_web_remote">Apertrove — пульт</title><link rel="stylesheet" href="/appearance.css"><link rel="stylesheet" href="/hud.css"><script src="/appearance.js"></script><script src="/lcd.js"></script>
</head><body>
<section id="login" hidden><div class="login-card"><span class="brand">APERTROVE</span><h1><span data-i18n="remote.markup.web_remote">Веб-пульт</span></h1><p><span data-i18n="remote.markup.open_the_qr_link_from_apertrove_or_enter_the_access_key">Откройте QR-ссылку из Apertrove или введите ключ доступа.</span></p><form id="login-form"><label for="key"><span data-i18n="remote.markup.access_key">Ключ доступа</span></label><input id="key" type="password" autocomplete="off" placeholder="Ключ доступа" data-i18n-placeholder="remote.markup.access_key" required><button class="primary"><span data-i18n="remote.markup.connect">Подключиться</span></button></form><p id="login-error" role="alert"></p></div></section>
<main id="hud" hidden>
<header class="hud-header"><div class="camera-heading"><span class="brand">APERTROVE <span><span data-i18n="remote.markup.web_remote_2">/ ВЕБ-ПУЛЬТ</span></span></span><h1 id="model"><span data-i18n="remote.markup.no_camera_connected">Камера не подключена</span></h1></div><div class="connection" role="status"><i id="online"></i><span id="connection-text"><span data-i18n="remote.markup.connecting">Подключение</span></span></div></header>
<div class="workspace-grid">
<section class="preview-column" aria-label="Просмотр" data-i18n-aria-label="remote.markup.preview">
<section class="viewfinder" id="viewfinder"><canvas id="preview" aria-label="Live View"></canvas><div id="view-empty"><span>LIVE VIEW</span><p><span data-i18n="remote.markup.preview_is_off">Просмотр выключен</span></p></div><div class="overlay top"><span class="chip" id="mode">—</span><span class="chip"><b id="fps">0</b> FPS</span><button id="fullscreen" class="chip" aria-label="Полный экран" data-i18n-aria-label="remote.markup.full_screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button></div><div class="overlay bottom"><span id="battery">—</span><span id="transfer"><span data-i18n="remote.markup.usb_pc_lan">USB → ПК → LAN</span></span></div></section>
<div class="toolbar"><button id="live" class="secondary"><span data-i18n="remote.markup.start_live_view">Включить Live View</span></button><div class="session-label"><span><span data-i18n="remote.markup.session">ФОТОСЕССИЯ</span></span><strong id="session">—</strong></div></div>
</section>
<aside class="control-column" aria-label="Управление камерой" data-i18n-aria-label="remote.markup.camera_controls">
<section class="panel exposure-panel" aria-label="Экспозиция" data-i18n-aria-label="remote.markup.exposure"><h2><span data-i18n="remote.markup.shooting_settings">Параметры съёмки</span></h2><div class="exposure">
<label><span><span data-i18n="remote.markup.shutter_speed">Выдержка</span></span><div class="exposure-value"><select data-property="shutter" aria-label="Выдержка" data-i18n-aria-label="remote.markup.shutter_speed"></select><svg class="lcd-readout" aria-hidden="true"></svg></div></label>
<label><span><span data-i18n="remote.markup.aperture">Диафрагма</span></span><div class="exposure-value"><select data-property="aperture" aria-label="Диафрагма" data-i18n-aria-label="remote.markup.aperture"></select><svg class="lcd-readout" aria-hidden="true"></svg></div></label>
<label><span>ISO</span><div class="exposure-value"><select data-property="iso" aria-label="ISO"></select><svg class="lcd-readout" aria-hidden="true"></svg></div></label>
</div><button id="more" class="secondary details-toggle" aria-expanded="false" aria-controls="details"><span><span data-i18n="remote.markup.all_settings">Все параметры</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></section>
<section class="panel" id="details" hidden aria-label="Все параметры" data-i18n-aria-label="remote.markup.all_settings">
<div class="details-grid"><label class="hud-ev"><span><span data-i18n="remote.markup.exposure_compensation">Экспокоррекция</span><output id="ev-value">— EV</output></span><input id="ev-slider" type="range" min="0" max="1" step="1" value="0" aria-label="Экспокоррекция" data-i18n-aria-label="remote.markup.exposure_compensation"></label><label><span data-i18n="remote.markup.white_balance">Баланс белого</span><select data-property="whiteBalance"></select></label><label>Picture Style<select data-property="pictureStyle"></select></label><label><span data-i18n="remote.markup.image_quality">Формат снимка</span><select data-property="imageQuality"></select></label><label><span data-i18n="remote.markup.drive_mode">Режим съёмки</span><select data-property="driveMode"></select></label><label><span data-i18n="remote.markup.af_mode">Режим AF</span><select data-property="afMode"></select></label><label><span data-i18n="remote.markup.live_view_af_method">Метод Live View</span><select data-property="liveAfMode"></select></label><label><span data-i18n="remote.markup.preset">Пресет</span><select id="presets"><option value="" data-i18n="remote.markup.none_selected">Не выбран</option></select></label></div>
<div class="camera-select"><label><span data-i18n="remote.markup.camera">Камера</span><select id="cameras" aria-label="Камера" data-i18n-aria-label="remote.markup.camera"></select></label><div><button id="refresh-cameras" class="secondary"><span data-i18n="remote.markup.refresh">Обновить</span></button><button id="connect-camera" class="secondary"><span data-i18n="remote.markup.connect_2">Подключить</span></button></div></div>
<div class="additional-actions"><button id="flash-popup" class="secondary"><span data-i18n="remote.markup.raise_flash">Поднять вспышку</span></button><button id="preset-series" class="secondary"><span data-i18n="remote.markup.shoot_preset_queue">Снять очередь пресетов</span></button></div>
<div class="interval-controls"><label><span data-i18n="remote.markup.shots">Кадров</span><input id="interval-count" type="number" inputmode="numeric" min="1" max="9999" value="10"></label><label><span data-i18n="remote.markup.pause_s">Пауза, с</span><input id="interval-seconds" type="number" inputmode="numeric" min="2" max="86400" value="5"></label><button id="interval" class="secondary"><span data-i18n="remote.markup.start_series">Начать серию</span></button></div>
</section>
<section class="panel focus" aria-label="Управление фокусом" data-i18n-aria-label="remote.markup.focus_controls"><div class="panel-heading"><h2><span data-i18n="remote.markup.focus">Фокус</span></h2><label class="focus-step-label"><span data-i18n="remote.markup.step">Шаг</span><select id="focus-step" aria-label="Шаг фокусировки" data-i18n-aria-label="remote.markup.focus_step"><option value="1" data-i18n="remote.markup.small">Малый</option><option value="2" data-i18n="remote.markup.medium">Средний</option><option value="3" data-i18n="remote.markup.large">Большой</option></select></label></div><div class="focus-actions"><button id="near" class="secondary"><span data-i18n="remote.markup.nearer">← Ближе</span></button><button id="af" class="primary" aria-label="Автофокус" data-i18n-aria-label="remote.markup.autofocus">AF</button><button id="far" class="secondary"><span data-i18n="remote.markup.farther">Дальше →</span></button></div></section>
</aside>
</div>
<footer class="capture-bar"><div class="capture-status"><span class="label"><span data-i18n="remote.markup.status">СОСТОЯНИЕ</span></span><p id="status">—</p></div><button id="shutter" aria-label="Сделать снимок" data-i18n-aria-label="remote.markup.take_photo"><span></span></button><div class="shot-count"><b id="count">0</b><span><span id="count-label" data-i18n="remote.markup.shots_in_session">кадров в сессии</span></span></div></footer>
<div id="message" role="status" hidden><p id="message-text"></p><button id="message-close" aria-label="Скрыть уведомление" data-i18n-aria-label="remote.markup.dismiss_notification"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
</main><script src="/composition-overlay.js"></script><script src="/focus-overlay.js"></script><script src="/i18n.js"></script><script src="/hud.js"></script>
</body></html>
